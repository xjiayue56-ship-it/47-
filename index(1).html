<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f6f3">
<title>47 小助手</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f6f3;--paper:#fff;--ink:#111;--muted:#8d8d87;--line:#e8e8e4;--soft:#f1f1ed;--red:#d92d20}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif}
button,input,textarea,select{font:inherit}.shell{min-height:100dvh;padding:24px 28px 100px}.top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:25px}.title{font-size:30px;font-weight:700;letter-spacing:-1px}.date{font-size:12px;color:var(--muted);margin-top:6px}.live{font-size:12px}.live:before{content:"";display:inline-block;width:7px;height:7px;background:#111;border-radius:50%;margin-right:7px}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,.8fr);gap:26px}.section-title{font-size:12px;color:var(--muted);margin-bottom:12px}
.queue,.logs{border-top:1px solid var(--line)}.case{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:13px;align-items:center;padding:17px 2px;border-bottom:1px solid var(--line);cursor:pointer}.avatar{width:42px;height:42px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-size:13px}.case h3{font-size:15px;margin:0 0 5px}.case p{font-size:12px;color:var(--muted);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag{font-size:11px;padding:6px 9px;border-radius:999px;background:var(--soft)}.tag.red{color:var(--red)}
.log{padding:15px 0;border-bottom:1px solid var(--line)}.time{font-size:10px;color:var(--muted);margin-bottom:5px}.log b{font-size:13px;font-weight:620}.log p{font-size:12px;color:#555;line-height:1.55;margin:5px 0 0}.count{font-size:11px;color:var(--red);margin-left:5px}
.dock-wrap{position:fixed;left:0;right:0;bottom:18px;display:flex;justify-content:center;pointer-events:none;z-index:20}.dock{pointer-events:auto;background:rgba(255,255,255,.78);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(0,0,0,.07);box-shadow:0 10px 35px rgba(0,0,0,.08);border-radius:24px;padding:8px;display:flex;gap:5px}.dock button{border:0;background:transparent;padding:10px 15px;border-radius:17px;cursor:pointer}.dock button.active{background:#111;color:#fff}
.view{display:none}.view.active{display:block}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.toolbar-actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;cursor:pointer}.btn.black{background:#111;color:#fff;border-color:#111}.btn.red{color:var(--red)}.kb-list{border-top:1px solid var(--line)}.kb-item{padding:17px 2px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:15px}.kb-item h3{font-size:15px;margin:0 0 6px}.kb-item p{font-size:12px;color:var(--muted);margin:0;line-height:1.45}.kb-meta{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}.empty{padding:55px 0;color:var(--muted);font-size:13px}
.overlay{position:fixed;inset:0;background:rgba(245,245,242,.72);backdrop-filter:blur(16px);display:none;align-items:center;justify-content:center;padding:22px;z-index:40}.overlay.show{display:flex}.sheet{width:min(760px,100%);max-height:90dvh;background:#fff;border-radius:28px;box-shadow:0 20px 70px rgba(0,0,0,.12);overflow:auto}.sheet-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:2}.close{border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;cursor:pointer}.sheet-body{padding:22px}.field{margin-bottom:18px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:0;background:var(--soft);border-radius:14px;padding:12px 13px;outline:none}.field textarea{min-height:170px;resize:vertical;line-height:1.55}.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.asset-list{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}.asset{background:var(--soft);border-radius:12px;padding:8px 10px;font-size:11px;display:flex;gap:8px;align-items:center}.asset button{border:0;background:transparent;color:var(--red);cursor:pointer}.sheet-actions{display:flex;justify-content:space-between;gap:10px;padding-top:8px}.setup{max-width:680px}.note{font-size:12px;color:#666;line-height:1.55;background:var(--soft);border-radius:14px;padding:12px 13px;margin-bottom:16px}
.statusbar{font-size:11px;color:var(--muted);margin-top:8px}.statusbar.ok{color:#2d6a4f}.statusbar.err{color:var(--red)}
@media(max-width:800px){
 .shell{padding:20px 17px 100px}.grid{grid-template-columns:1fr}.title{font-size:26px}.right{margin-top:10px}.case{grid-template-columns:38px minmax(0,1fr) auto}.avatar{width:38px;height:38px}.dock{max-width:calc(100vw - 26px);overflow:auto}.dock button{padding:9px 12px;white-space:nowrap}.sheet{height:92dvh;border-radius:22px}.sheet-body{padding:18px}.row2{grid-template-columns:1fr}.kb-item{align-items:flex-start}.kb-meta{max-width:120px}
}
</style></head>
<body>
<div class="shell">
 <div class="top"><div><div class="title">47 小助手</div><div class="date">管理台 · 知识库已接入真实数据</div></div><div class="live" id="liveState">未连接</div></div>

 <div id="home" class="view active">
  <div class="grid">
   <section><div class="section-title">正在处理</div><div class="queue" id="queue"></div></section>
   <aside class="right"><div class="section-title">今日日志</div><div class="logs" id="logs"></div></aside>
  </div>
 </div>

 <div id="knowledge" class="view">
   <div class="toolbar"><div><div class="section-title" style="margin:0">知识库</div><div class="statusbar" id="kbStatus">等待连接</div></div>
   <div class="toolbar-actions"><button class="btn" onclick="openSetup()">数据连接</button><button class="btn black" onclick="newArticle()">＋ 新增教程</button></div></div>
   <div class="kb-list" id="kbList"></div>
 </div>

 <div id="review" class="view"><div class="section-title">需要确认</div><div class="queue"><div class="case"><div class="avatar">M</div><div><h3>Momo · 模型列表为空</h3><p>重新导入和复制 URL 后仍为空，需要确认站点兼容情况。</p></div><span class="tag red">待你确认</span></div></div></div>
</div>

<div class="dock-wrap"><nav class="dock">
 <button class="active" onclick="showView('home',this)">处理中</button>
 <button onclick="showView('knowledge',this)">知识库</button>
 <button onclick="showView('review',this)">待确认</button>
</nav></div>

<div class="overlay" id="editorOverlay"><div class="sheet">
 <div class="sheet-head"><b id="editorTitle">新增教程</b><button class="close" onclick="closeEditor()">×</button></div>
 <div class="sheet-body">
  <input type="hidden" id="articleId">
  <div class="field"><label>教程名称</label><input id="aTitle" placeholder="例如：API 完全新手入门"></div>
  <div class="row2">
   <div class="field"><label>分类</label><input id="aCategory" placeholder="例如：API / 语音 / 生图"></div>
   <div class="field"><label>状态</label><select id="aStatus"><option value="active">已启用</option><option value="draft">草稿</option></select></div>
  </div>
  <div class="field"><label>关键词（用逗号分隔）</label><input id="aKeywords" placeholder="API, 新手, 站子"></div>
  <div class="field"><label>教程正文</label><textarea id="aContent" placeholder="把你的完整教程直接粘贴到这里…"></textarea></div>
  <div class="field"><label>教程图片 / 文件</label><input type="file" id="assetInput" multiple accept="image/*,.pdf,.txt,.md"><div class="asset-list" id="assetList"></div></div>
  <div class="sheet-actions"><button class="btn red" id="deleteBtn" onclick="deleteArticle()" style="visibility:hidden">删除</button><button class="btn black" onclick="saveArticle()">自动保存 / 完成</button></div>
  <div class="statusbar" id="editorStatus"></div>
 </div>
</div></div>

<div class="overlay" id="setupOverlay"><div class="sheet setup">
 <div class="sheet-head"><b>连接 Supabase</b><button class="close" onclick="closeSetup()">×</button></div>
 <div class="sheet-body">
  <div class="note">这一步只做一次。填写你自己的 Supabase Project URL 和 anon key。它们会保存在当前浏览器本地，不会写进 GitHub 仓库。真正的敏感 service role key 不要放在这里。</div>
  <div class="field"><label>Supabase Project URL</label><input id="sUrl" placeholder="https://xxxx.supabase.co"></div>
  <div class="field"><label>Supabase anon key</label><textarea id="sKey" style="min-height:110px" placeholder="eyJ..."></textarea></div>
  <div class="sheet-actions"><button class="btn" onclick="disconnect()">断开</button><button class="btn black" onclick="connectSupabase()">连接并同步</button></div>
  <div class="statusbar" id="setupStatus"></div>
 </div>
</div></div>

<script>
const demoCases=[
{name:"小雨",status:"AI 正在处理",topic:"API 是什么？新手引导中",preview:"正在解释 API，并准备引导寻找 API 站。"},
{name:"Momo",status:"需要你确认",topic:"模型列表为空",preview:"重新导入和复制 URL 后仍为空。"},
{name:"77",status:"人工处理中",topic:"语音无法播放",preview:"已人工接管，等待用户发送设置截图。"}];
const demoLogs=[
["12:18","API 新手问题已解决","已完成基础解释并同步「新手识别 → 低术语引导」规则。","重复 4 次"],
["11:46","新增问题：模型列表为空","已有排查步骤无法解决，已自动加入「待确认」。",""],
["10:30","语音设置问题已解决","用户配置错误；解决步骤已记录到知识库草稿。","重复 2 次"],
["09:12","知识库已更新","「如何寻找 API 站」新增不主动提供推广/返利链接规范。",""]
];
let sb=null, articles=[], currentAssets=[], pendingFiles=[];

function renderHome(){
 queue.innerHTML=demoCases.map(x=>`<div class="case"><div class="avatar">${x.name.slice(0,1)}</div><div><h3>${x.name} · ${x.topic}</h3><p>${x.preview}</p></div><span class="tag ${x.status.includes('确认')?'red':''}">${x.status}</span></div>`).join("");
 logs.innerHTML=demoLogs.map(x=>`<div class="log"><div class="time">${x[0]}</div><b>${x[1]}</b>${x[3]?`<span class=count>${x[3]}</span>`:""}<p>${x[2]}</p></div>`).join("");
}
function showView(id,b){document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll(".dock button").forEach(x=>x.classList.remove("active"));b.classList.add("active");if(id==="knowledge")loadArticles()}
function setState(t,ok=false,err=false){liveState.textContent=t;kbStatus.textContent=t;kbStatus.className="statusbar "+(ok?"ok":err?"err":"")}
function getCfg(){return {url:localStorage.getItem("47_sb_url")||"",key:localStorage.getItem("47_sb_key")||""}}
async function initSupabase(){
 const c=getCfg(); if(!c.url||!c.key){setState("未连接数据",false,false);renderArticles();return}
 try{sb=supabase.createClient(c.url,c.key); const {error}=await sb.from("kb_articles").select("id",{count:"exact",head:true}); if(error)throw error; setState("数据已同步",true); await loadArticles()}catch(e){console.error(e);setState("连接失败",false,true);renderArticles()}
}
function openSetup(){const c=getCfg();sUrl.value=c.url;sKey.value=c.key;setupStatus.textContent="";setupOverlay.classList.add("show")}
function closeSetup(){setupOverlay.classList.remove("show")}
async function connectSupabase(){
 const url=sUrl.value.trim(), key=sKey.value.trim(); if(!url||!key){setupStatus.textContent="请填写 URL 和 anon key";return}
 localStorage.setItem("47_sb_url",url);localStorage.setItem("47_sb_key",key);setupStatus.textContent="正在连接…";await initSupabase();
 if(sb){setupStatus.textContent="连接成功";setTimeout(closeSetup,600)}
}
function disconnect(){localStorage.removeItem("47_sb_url");localStorage.removeItem("47_sb_key");sb=null;articles=[];setState("未连接数据");renderArticles();closeSetup()}
async function loadArticles(){
 if(!sb){renderArticles();return}
 kbStatus.textContent="正在同步…";
 const {data,error}=await sb.from("kb_articles").select("*").order("updated_at",{ascending:false});
 if(error){kbStatus.textContent="读取失败："+error.message;kbStatus.className="statusbar err";return}
 articles=data||[];kbStatus.textContent=`已同步 ${articles.length} 篇教程`;kbStatus.className="statusbar ok";renderArticles()
}
function renderArticles(){
 if(!articles.length){kbList.innerHTML=`<div class="empty">${sb?"还没有教程。点右上角「＋ 新增教程」开始上传。":"先点右上角「数据连接」，连接 Supabase 后即可跨设备同步教程。"}</div>`;return}
 kbList.innerHTML=articles.map(a=>`<div class="kb-item" onclick='editArticle(${JSON.stringify(a.id)})'><div><h3>${esc(a.title)}</h3><p>${esc((a.content||"").slice(0,110))}${(a.content||"").length>110?"…":""}</p></div><div class="kb-meta"><span class="tag">${esc(a.category||"未分类")}</span><span class="tag ${a.status==="draft"?"red":""}">${a.status==="draft"?"草稿":"已启用"}</span></div></div>`).join("")
}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function newArticle(){if(!sb){openSetup();return}articleId.value="";aTitle.value="";aCategory.value="";aStatus.value="active";aKeywords.value="";aContent.value="";currentAssets=[];pendingFiles=[];renderAssets();editorTitle.textContent="新增教程";deleteBtn.style.visibility="hidden";editorStatus.textContent="";editorOverlay.classList.add("show")}
function editArticle(id){const a=articles.find(x=>x.id===id);if(!a)return;articleId.value=a.id;aTitle.value=a.title||"";aCategory.value=a.category||"";aStatus.value=a.status||"active";aKeywords.value=(a.keywords||[]).join(", ");aContent.value=a.content||"";currentAssets=a.assets||[];pendingFiles=[];renderAssets();editorTitle.textContent="编辑教程";deleteBtn.style.visibility="visible";editorStatus.textContent="";editorOverlay.classList.add("show")}
function closeEditor(){editorOverlay.classList.remove("show")}
assetInput.addEventListener("change",e=>{pendingFiles=[...pendingFiles,...Array.from(e.target.files||[])];renderAssets();assetInput.value=""})
function renderAssets(){
 const old=currentAssets.map((a,i)=>`<div class=asset>${esc(a.name||"文件")}<button onclick="event.stopPropagation();removeOld(${i})">×</button></div>`);
 const neu=pendingFiles.map((f,i)=>`<div class=asset>${esc(f.name)}<button onclick="event.stopPropagation();removeNew(${i})">×</button></div>`);
 assetList.innerHTML=[...old,...neu].join("")
}
function removeOld(i){currentAssets.splice(i,1);renderAssets()} function removeNew(i){pendingFiles.splice(i,1);renderAssets()}
async function uploadPending(articleIdValue){
 const uploaded=[];
 for(const f of pendingFiles){
  const safe=(Date.now()+"_"+Math.random().toString(36).slice(2)+"_"+f.name).replace(/[^\w.\-]/g,"_");
  const path=`${articleIdValue}/${safe}`;
  const {error}=await sb.storage.from("kb-assets").upload(path,f,{upsert:false});
  if(error)throw error;
  const {data}=sb.storage.from("kb-assets").getPublicUrl(path);
  uploaded.push({name:f.name,path,url:data.publicUrl,type:f.type,size:f.size});
 }
 return uploaded
}
async function saveArticle(){
 if(!sb){editorStatus.textContent="尚未连接数据";return}
 const title=aTitle.value.trim(); if(!title){editorStatus.textContent="请先写教程名称";return}
 editorStatus.textContent="正在保存…";
 try{
  let id=articleId.value;
  const base={title,category:aCategory.value.trim(),status:aStatus.value,keywords:aKeywords.value.split(",").map(x=>x.trim()).filter(Boolean),content:aContent.value,updated_at:new Date().toISOString()};
  if(!id){
    const {data,error}=await sb.from("kb_articles").insert({...base,assets:[]}).select().single(); if(error)throw error; id=data.id;
  }else{
    const {error}=await sb.from("kb_articles").update(base).eq("id",id); if(error)throw error;
  }
  const newAssets=await uploadPending(id); const all=[...currentAssets,...newAssets];
  const {error:e2}=await sb.from("kb_articles").update({assets:all,updated_at:new Date().toISOString()}).eq("id",id); if(e2)throw e2;
  editorStatus.textContent="已保存并同步"; editorStatus.className="statusbar ok"; await loadArticles(); setTimeout(closeEditor,500)
 }catch(e){console.error(e);editorStatus.textContent="保存失败："+e.message;editorStatus.className="statusbar err"}
}
async function deleteArticle(){
 const id=articleId.value;if(!id||!confirm("确定删除这篇教程吗？"))return;
 const {error}=await sb.from("kb_articles").delete().eq("id",id);if(error){editorStatus.textContent="删除失败："+error.message;return}
 await loadArticles();closeEditor()
}
renderHome();renderArticles();initSupabase();
</script>
</body></html>
