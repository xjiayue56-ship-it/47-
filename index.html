<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f6f3">
<title>47 小助手</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f6f3;--paper:#fff;--ink:#111;--muted:#8d8d87;--line:#e8e8e4;--soft:#f1f1ed;--red:#d92d20}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif}
button,input,textarea,select{font:inherit}.shell{min-height:100dvh;padding:24px 28px 100px}.top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:25px}.title{font-size:30px;font-weight:700;letter-spacing:-1px}.date{font-size:12px;color:var(--muted);margin-top:6px}.live{font-size:12px}.live:before{content:"";display:inline-block;width:7px;height:7px;background:#111;border-radius:50%;margin-right:7px}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,.8fr);gap:26px}.section-title{font-size:12px;color:var(--muted);margin-bottom:12px}
.queue,.logs{border-top:1px solid var(--line)}.case{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:13px;align-items:center;padding:17px 2px;border-bottom:1px solid var(--line);cursor:pointer}.avatar{width:42px;height:42px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-size:13px}.case h3{font-size:15px;margin:0 0 5px}.case p{font-size:12px;color:var(--muted);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag{font-size:11px;padding:6px 9px;border-radius:999px;background:var(--soft)}.tag.red{color:var(--red)}
.log{padding:15px 0;border-bottom:1px solid var(--line)}.time{font-size:10px;color:var(--muted);margin-bottom:5px}.log b{font-size:13px;font-weight:620}.log p{font-size:12px;color:#555;line-height:1.55;margin:5px 0 0}.count{font-size:11px;color:var(--red);margin-left:5px}
.dock-wrap{position:fixed;left:0;right:0;bottom:18px;display:flex;justify-content:center;pointer-events:none;z-index:20}.dock{pointer-events:auto;background:rgba(255,255,255,.78);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(0,0,0,.07);box-shadow:0 10px 35px rgba(0,0,0,.08);border-radius:24px;padding:8px;display:flex;gap:5px}.dock button{border:0;background:transparent;padding:10px 15px;border-radius:17px;cursor:pointer}.dock button.active{background:#111;color:#fff}
.view{display:none}.view.active{display:block}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.toolbar-actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;cursor:pointer}.btn.black{background:#111;color:#fff;border-color:#111}.btn.red{color:var(--red)}.kb-list{border-top:1px solid var(--line)}.kb-item{padding:17px 2px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:15px}.kb-item h3{font-size:15px;margin:0 0 6px}.kb-item p{font-size:12px;color:var(--muted);margin:0;line-height:1.45}.kb-meta{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}.empty{padding:55px 0;color:var(--muted);font-size:13px}
.overlay{position:fixed;inset:0;background:rgba(245,245,242,.72);backdrop-filter:blur(16px);display:none;align-items:center;justify-content:center;padding:22px;z-index:40}.overlay.show{display:flex}.sheet{width:min(760px,100%);max-height:90dvh;background:#fff;border-radius:28px;box-shadow:0 20px 70px rgba(0,0,0,.12);overflow:auto}.sheet-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:2}.close{border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;cursor:pointer}.sheet-body{padding:22px}.field{margin-bottom:18px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:0;background:var(--soft);border-radius:14px;padding:12px 13px;outline:none}.field textarea{min-height:170px;resize:vertical;line-height:1.55}.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.asset-list{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}.asset{background:var(--soft);border-radius:12px;padding:8px 10px;font-size:11px;display:flex;gap:8px;align-items:center}.asset button{border:0;background:transparent;color:var(--red);cursor:pointer}.sheet-actions{display:flex;justify-content:space-between;gap:10px;padding-top:8px}.setup{max-width:680px}.note{font-size:12px;color:#666;line-height:1.55;background:var(--soft);border-radius:14px;padding:12px 13px;margin-bottom:16px}
.statusbar{font-size:11px;color:var(--muted);margin-top:8px}.statusbar.ok{color:#2d6a4f}.statusbar.err{color:var(--red)}
@media(max-width:800px){
 .shell{padding:20px 17px 100px}.grid{grid-template-columns:1fr}.title{font-size:26px}.right{margin-top:10px}.case{grid-template-columns:38px minmax(0,1fr) auto}.avatar{width:38px;height:38px}.dock{max-width:calc(100vw - 26px);overflow:auto}.dock button{padding:9px 12px;white-space:nowrap}.sheet{height:92dvh;border-radius:22px}.sheet-body{padding:18px}.row2{grid-template-columns:1fr}.kb-item{align-items:flex-start}.kb-meta{max-width:120px}
}

.chat-sheet{width:min(760px,100%);height:min(780px,90dvh);display:flex;flex-direction:column;overflow:hidden}
.chat-head-main{min-width:0}.chat-head-main b{display:block}.chat-sub{font-size:11px;color:var(--muted);margin-top:4px}
.chat-messages{flex:1;overflow:auto;padding:20px 22px;background:#fff}
.msg-row{display:flex;margin:9px 0}.msg-row.inbound{justify-content:flex-start}.msg-row.outbound{justify-content:flex-end}
.msg-bubble{max-width:min(78%,520px);padding:10px 13px;border-radius:17px;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.msg-row.inbound .msg-bubble{background:var(--soft);border-bottom-left-radius:6px}
.msg-row.outbound .msg-bubble{background:#111;color:#fff;border-bottom-right-radius:6px}
.msg-meta{font-size:9px;color:var(--muted);margin-top:4px}.msg-row.outbound .msg-meta{text-align:right}
.chat-foot{padding:13px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);background:#fff}
.case .unread{min-width:20px;height:20px;border-radius:999px;background:#111;color:#fff;display:inline-grid;place-items:center;padding:0 6px;font-size:10px;margin-left:7px}


.chat-compose{display:flex;gap:10px;align-items:flex-end;padding:12px 16px;border-top:1px solid var(--line);background:#fff}
.chat-compose textarea{flex:1;min-height:42px;max-height:120px;resize:none;border:1px solid var(--line);border-radius:14px;padding:11px 13px;font:inherit;outline:none;background:#fff;color:var(--ink)}
.chat-compose textarea:focus{border-color:#999}
.chat-send{border:0;background:#111;color:#fff;border-radius:14px;padding:11px 18px;font-weight:700;cursor:pointer;min-height:42px}
.chat-send:disabled{opacity:.35;cursor:not-allowed}
.chat-send-note{font-size:10px;color:var(--muted);padding:0 18px 10px;background:#fff}


/* v0.3.1 — normal chat bubble sizing */
.msg-row{min-width:0}
.msg-row>div{display:flex;flex-direction:column;min-width:0;max-width:76%}
.msg-row.inbound>div{align-items:flex-start}
.msg-row.outbound>div{align-items:flex-end}
.msg-bubble{
  display:inline-block;
  width:max-content;
  max-width:100%;
  min-width:0;
  box-sizing:border-box;
  white-space:pre-wrap;
  overflow-wrap:break-word;
  word-break:normal;
}
.msg-meta{width:max-content;max-width:100%}
@media(max-width:640px){
  .msg-row>div{max-width:82%}
}


/* v0.4 — AI / knowledge / human review */
.review-case{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:17px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.review-case h3{font-size:15px;margin:0 0 6px}.review-case p{font-size:12px;color:var(--muted);margin:0;line-height:1.5}
.review-reason{font-size:11px;color:var(--red);margin-top:6px}
.review-source{padding:10px 0;border-bottom:1px solid var(--line)}
.review-source b{font-size:12px}.review-source p{font-size:11px;color:var(--muted);line-height:1.45;margin:4px 0 0}
.review-actions{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.ai-badge{font-size:9px;color:var(--muted);margin-left:6px}

</style></head>
<body>
<div class="shell">
 <div class="top"><div><div class="title">47 小助手</div><div class="date">管理台 · 真实数据模式</div></div><div class="live" id="liveState">未连接</div></div>

 <div id="home" class="view active">
  <div class="grid">
   <section><div class="section-title">正在处理</div><div class="queue" id="queue"></div></section>
   <aside class="right"><div class="section-title">今日日志</div><div class="logs" id="logs"></div></aside>
  </div>
 </div>

 <div id="knowledge" class="view">
   <div class="toolbar"><div><div class="section-title" style="margin:0">知识库</div><div class="statusbar" id="kbStatus">等待连接</div></div>
   <div class="toolbar-actions"><button class="btn" onclick="openSetup()">数据连接</button><button class="btn black" onclick="newArticle()">＋ 新增教程</button></div></div>
   <div class="kb-list" id="kbList"></div>
 </div>

 <div id="review" class="view">
  <div class="toolbar"><div><div class="section-title" style="margin:0">需要确认</div><div class="statusbar" id="reviewStatus">等待同步</div></div></div>
  <div class="queue" id="reviewQueue"></div>
 </div>
</div>

<div class="dock-wrap"><nav class="dock">
 <button class="active" onclick="showView('home',this)">处理中</button>
 <button onclick="showView('knowledge',this)">知识库</button>
 <button onclick="showView('review',this)">待确认</button>
</nav></div>


<div class="overlay" id="chatOverlay"><div class="sheet chat-sheet">
 <div class="sheet-head">
  <div class="chat-head-main"><b id="chatTitle">QQ 会话</b><div class="chat-sub" id="chatSub"></div></div>
  <button class="close" onclick="closeChat()">×</button>
 </div>
 <div class="chat-messages" id="chatMessages"></div>
 <div class="chat-compose">
  <textarea id="replyInput" placeholder="输入回复…" onkeydown="replyKeydown(event)"></textarea>
  <button class="chat-send" id="replySend" onclick="sendReply()">发送</button>
 </div>
 <div class="chat-send-note" id="replyNote">发送后会进入待发送队列，由 Mac 上运行的 QQ Bridge 发到对方 QQ。</div>
</div></div>

<div class="overlay" id="reviewOverlay"><div class="sheet">
 <div class="sheet-head"><div><b id="reviewTitle">待确认</b><div class="chat-sub" id="reviewSub"></div></div><button class="close" onclick="closeReview()">×</button></div>
 <div class="sheet-body">
  <input type="hidden" id="reviewId">
  <div class="field"><label>用户问题</label><div id="reviewQuestion" style="white-space:pre-wrap;line-height:1.6"></div></div>
  <div class="field"><label>为什么需要人工确认</label><div id="reviewReason" class="note"></div></div>
  <div class="field"><label>AI 草稿（可以直接修改）</label><textarea id="reviewDraft" placeholder="如果 AI 没有可靠草稿，可以在这里自己写回复。"></textarea></div>
  <div class="field"><label>参考知识库</label><div id="reviewSources"></div></div>
  <div class="review-actions">
    <button class="btn" onclick="resolveWithoutSend()">仅标记已处理</button>
    <button class="btn black" onclick="approveReview()">确认并发送</button>
  </div>
  <div class="statusbar" id="reviewActionStatus"></div>
 </div>
</div></div>

<div class="overlay" id="editorOverlay"><div class="sheet">
 <div class="sheet-head"><b id="editorTitle">新增教程</b><button class="close" onclick="closeEditor()">×</button></div>
 <div class="sheet-body">
  <input type="hidden" id="articleId">
  <div class="field"><label>教程名称</label><input id="aTitle" placeholder="例如：API 完全新手入门"></div>
  <div class="row2">
   <div class="field"><label>分类</label><input id="aCategory" placeholder="例如：API / 语音 / 生图"></div>
   <div class="field"><label>状态</label><select id="aStatus"><option value="active">已启用</option><option value="draft">草稿</option></select></div>
  </div>
  <div class="field"><label>关键词（用逗号分隔）</label><input id="aKeywords" placeholder="API, 新手, 站子"></div>
  <div class="field"><label>教程正文</label><textarea id="aContent" placeholder="把你的完整教程直接粘贴到这里…"></textarea></div>
  <div class="field"><label>教程图片 / 文件</label><input type="file" id="assetInput" multiple accept="image/*,.pdf,.txt,.md"><div class="asset-list" id="assetList"></div></div>
  <div class="sheet-actions"><button class="btn red" id="deleteBtn" onclick="deleteArticle()" style="visibility:hidden">删除</button><button class="btn black" onclick="saveArticle()">自动保存 / 完成</button></div>
  <div class="statusbar" id="editorStatus"></div>
 </div>
</div></div>

<div class="overlay" id="setupOverlay"><div class="sheet setup">
 <div class="sheet-head"><b>连接 Supabase</b><button class="close" onclick="closeSetup()">×</button></div>
 <div class="sheet-body">
  <div class="note">这一步只做一次。填写你自己的 Supabase Project URL 和 anon key。它们会保存在当前浏览器本地，不会写进 GitHub 仓库。真正的敏感 service role key 不要放在这里。</div>
  <div class="field"><label>Supabase Project URL</label><input id="sUrl" placeholder="https://xxxx.supabase.co"></div>
  <div class="field"><label>Supabase anon key</label><textarea id="sKey" style="min-height:110px" placeholder="eyJ..."></textarea></div>
  <div class="sheet-actions"><button class="btn" onclick="disconnect()">断开</button><button class="btn black" onclick="connectSupabase()">连接并同步</button></div>
  <div class="statusbar" id="setupStatus"></div>
 </div>
</div></div>

<script>
const demoCases=[];
const demoLogs=[];
let sb=null, articles=[], conversations=[], reviews=[], logsData=[], currentConversation=null, currentReview=null, currentAssets=[], pendingFiles=[], supportPoll=null;

function renderHome(){
 if(!sb){
  queue.innerHTML=`<div class="empty">先连接 Supabase。连接后真实 QQ 私聊会显示在这里。</div>`;
  logs.innerHTML=`<div class="empty">暂无日志。</div>`;
  return;
 }
 queue.innerHTML = conversations.length
   ? conversations.map(x=>{
      const name=esc(x.display_name||x.external_user_id||"QQ用户");
      const preview=esc(x.last_message||"");
      const unread=Number(x.unread_count||0);
      const status=x.status==="needs_review"?"待确认":x.status==="closed"?"已完成":"处理中";
      const tag=x.status==="needs_review"?"red":"";
      return `<div class="case" onclick="openChat('${x.id}')"><div class="avatar">${name.slice(0,1)}</div><div><h3>${name}${unread?`<span class="unread">${unread}</span>`:""}</h3><p>${preview}</p></div><span class="tag ${tag}">${status}</span></div>`
    }).join("")
   : `<div class="empty">暂无正在处理的会话。现在有人给测试 QQ 发私聊后，会自动出现在这里。</div>`;
 logs.innerHTML = logsData.length ? logsData.map(x=>{
   const tm=new Date(x.created_at).toLocaleString("zh-CN",{hour:"2-digit",minute:"2-digit"});
   const names={auto_reply:"AI 自动回复",needs_review:"转人工确认",human_reply:"人工确认发送",ai_error:"AI 处理异常"};
   return `<div class="log"><div class="time">${tm}</div><b>${esc(names[x.event_type]||x.event_type||"处理记录")}</b><p>${esc(x.summary||"")}</p></div>`
 }).join("") : `<div class="empty">暂无日志。</div>`;
}
function showView(id,b){
 document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 document.querySelectorAll(".dock button").forEach(x=>x.classList.remove("active"));
 b.classList.add("active");
 if(id==="knowledge")loadArticles();
 if(id==="home")loadSupport();
 if(id==="review")loadReviews();
}

async function loadSupport(){
 if(!sb){conversations=[];renderHome();return}
 const {data,error}=await sb.from("support_conversations").select("*").neq("status","closed").order("last_message_at",{ascending:false});
 if(error){console.error(error);conversations=[];renderHome();return}
 conversations=data||[];
 const {data:lg,error:le}=await sb.from("support_logs").select("*").order("created_at",{ascending:false}).limit(30);
 logsData=le?[]:(lg||[]);
 renderHome();
}
async function openChat(id){
 if(!sb)return;
 currentConversation=conversations.find(x=>x.id===id)||null;
 if(!currentConversation)return;
 chatTitle.textContent=currentConversation.display_name||currentConversation.external_user_id||"QQ 会话";
 chatSub.textContent=`QQ ${currentConversation.external_user_id||""}`;
 chatMessages.innerHTML=`<div class="empty">正在读取聊天…</div>`;
 chatOverlay.classList.add("show");
 const {data,error}=await sb.from("support_messages").select("*").eq("conversation_id",id).order("created_at",{ascending:true});
 if(error){chatMessages.innerHTML=`<div class="empty">读取失败：${esc(error.message)}</div>`;return}
 const rows=data||[];
 chatMessages.innerHTML=rows.length?rows.map(m=>{
   const side=m.direction==="outbound"?"outbound":"inbound";
   const tm=new Date(m.created_at).toLocaleString("zh-CN",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
   return `<div class="msg-row ${side}"><div><div class="msg-bubble">${esc(m.content||"")}</div><div class="msg-meta">${esc(m.sender_name||"")} · ${tm}</div></div></div>`
 }).join(""):`<div class="empty">暂时没有消息。</div>`;
 chatMessages.scrollTop=chatMessages.scrollHeight;
 if(Number(currentConversation.unread_count||0)>0){
   await sb.from("support_conversations").update({unread_count:0,updated_at:new Date().toISOString()}).eq("id",id);
   currentConversation.unread_count=0; renderHome();
 }
}

async function sendReply(){
 if(!sb||!currentConversation)return;
 const input=document.getElementById("replyInput"), btn=document.getElementById("replySend"), note=document.getElementById("replyNote");
 const text=(input.value||"").trim(); if(!text)return;
 btn.disabled=true; note.textContent="正在加入发送队列…";
 const now=new Date().toISOString();
 const {error}=await sb.from("support_messages").insert({
   conversation_id:currentConversation.id,
   channel:"qq",
   direction:"outbound",
   sender_id:"47-helper",
   sender_name:"47小助手",
   message_type:"text",
   content:text,
   raw_payload:{source:"admin_web",delivery_status:"pending"},
   delivery_status:"pending",
   created_at:now
 });
 if(error){note.textContent="发送失败："+error.message;btn.disabled=false;return}
 await sb.from("support_conversations").update({
   last_message:text,last_message_at:now,updated_at:now
 }).eq("id",currentConversation.id);
 input.value=""; note.textContent="已加入发送队列，等待 QQ Bridge 发送…";
 btn.disabled=false;
 await openChat(currentConversation.id);
}
function replyKeydown(e){
 if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendReply()}
}

function closeChat(){chatOverlay.classList.remove("show");currentConversation=null}
function startSupportPolling(){
 if(supportPoll)clearInterval(supportPoll);
 supportPoll=setInterval(()=>{if(sb){loadSupport();loadReviews()}},4000);
}


async function loadReviews(){
 if(!sb){reviews=[];renderReviews();return}
 reviewStatus.textContent="正在同步…";
 const {data,error}=await sb.from("support_reviews")
   .select("*,support_conversations(display_name,external_user_id)")
   .eq("status","pending").order("created_at",{ascending:false});
 if(error){reviewStatus.textContent="读取失败："+error.message;reviewStatus.className="statusbar err";reviews=[];renderReviews();return}
 reviews=data||[];reviewStatus.textContent=reviews.length?`${reviews.length} 条待确认`:"暂无待确认";reviewStatus.className="statusbar ok";renderReviews();
}
function renderReviews(){
 reviewQueue.innerHTML=reviews.length?reviews.map(r=>{
   const c=r.support_conversations||{};
   const who=esc(c.display_name||c.external_user_id||"QQ用户");
   return `<div class="review-case" onclick="openReview('${r.id}')"><div><h3>${who}</h3><p>${esc(r.question||"")}</p><div class="review-reason">${esc(r.reason||"需要人工确认")}</div></div><span class="tag red">待确认</span></div>`
 }).join(""):`<div class="empty">暂无待确认事项。AI 能确定的会直接回复，无法可靠回答的问题会出现在这里。</div>`;
}
async function openReview(id){
 currentReview=reviews.find(x=>x.id===id)||null;if(!currentReview)return;
 const c=currentReview.support_conversations||{};
 reviewId.value=currentReview.id;
 reviewTitle.textContent=c.display_name||"待确认";
 reviewSub.textContent=`QQ ${c.external_user_id||""}`;
 reviewQuestion.textContent=currentReview.question||"";
 reviewReason.textContent=currentReview.reason||"知识库不足或 AI 无法可靠判断";
 reviewDraft.value=currentReview.draft_answer||"";
 const src=Array.isArray(currentReview.sources)?currentReview.sources:[];
 reviewSources.innerHTML=src.length?src.map(s=>`<div class="review-source"><b>${esc(s.title||"知识库")}</b><p>${esc(s.excerpt||"")}</p></div>`).join(""):`<div class="empty" style="padding:14px 0">没有可靠的知识库来源。</div>`;
 reviewActionStatus.textContent="";
 reviewOverlay.classList.add("show");
}
function closeReview(){reviewOverlay.classList.remove("show");currentReview=null}
async function approveReview(){
 if(!sb||!currentReview)return;
 const answer=reviewDraft.value.trim();if(!answer){reviewActionStatus.textContent="请先填写要发送的回复";return}
 reviewActionStatus.textContent="正在加入发送队列…";
 const now=new Date().toISOString();
 const {error}=await sb.from("support_messages").insert({
   conversation_id:currentReview.conversation_id,channel:"qq",direction:"outbound",
   sender_id:"47-helper-human",sender_name:"47小助手",message_type:"text",content:answer,
   raw_payload:{source:"human_review",review_id:currentReview.id},delivery_status:"pending",created_at:now
 });
 if(error){reviewActionStatus.textContent="发送失败："+error.message;reviewActionStatus.className="statusbar err";return}
 await sb.from("support_reviews").update({status:"resolved",final_answer:answer,resolved_at:now}).eq("id",currentReview.id);
 await sb.from("support_conversations").update({status:"processing",last_message:answer,last_message_at:now,updated_at:now}).eq("id",currentReview.conversation_id);
 await sb.from("support_logs").insert({conversation_id:currentReview.conversation_id,event_type:"human_reply",summary:"人工确认后已加入 QQ 发送队列",details:{review_id:currentReview.id}});
 reviewActionStatus.textContent="已确认，等待 QQ Bridge 发送";reviewActionStatus.className="statusbar ok";
 await Promise.all([loadReviews(),loadSupport()]);
 setTimeout(closeReview,500);
}
async function resolveWithoutSend(){
 if(!sb||!currentReview)return;
 const now=new Date().toISOString();
 await sb.from("support_reviews").update({status:"dismissed",resolved_at:now}).eq("id",currentReview.id);
 await sb.from("support_conversations").update({status:"processing",updated_at:now}).eq("id",currentReview.conversation_id);
 await loadReviews();closeReview();
}

function setState(t,ok=false,err=false){liveState.textContent=t;kbStatus.textContent=t;kbStatus.className="statusbar "+(ok?"ok":err?"err":"")}
function getCfg(){return {url:localStorage.getItem("47_sb_url")||"",key:localStorage.getItem("47_sb_key")||""}}
async function initSupabase(){
 const c=getCfg(); if(!c.url||!c.key){setState("未连接数据",false,false);renderArticles();renderHome();return}
 try{
  sb=supabase.createClient(c.url,c.key);
  const {error}=await sb.from("kb_articles").select("id",{count:"exact",head:true}); if(error)throw error;
  setState("数据已同步",true);
  await Promise.all([loadArticles(),loadSupport(),loadReviews()]);
  startSupportPolling();
 }catch(e){
  console.error(e);setState("连接失败",false,true);renderArticles();renderHome()
 }
}
function openSetup(){const c=getCfg();sUrl.value=c.url;sKey.value=c.key;setupStatus.textContent="";setupOverlay.classList.add("show")}
function closeSetup(){setupOverlay.classList.remove("show")}
async function connectSupabase(){
 const url=sUrl.value.trim(), key=sKey.value.trim(); if(!url||!key){setupStatus.textContent="请填写 URL 和 anon key";return}
 localStorage.setItem("47_sb_url",url);localStorage.setItem("47_sb_key",key);setupStatus.textContent="正在连接…";await initSupabase();
 if(sb){setupStatus.textContent="连接成功";setTimeout(closeSetup,600)}
}
function disconnect(){localStorage.removeItem("47_sb_url");localStorage.removeItem("47_sb_key");if(supportPoll)clearInterval(supportPoll);supportPoll=null;sb=null;articles=[];conversations=[];setState("未连接数据");renderArticles();renderHome();closeSetup()}
async function loadArticles(){
 if(!sb){renderArticles();return}
 kbStatus.textContent="正在同步…";
 const {data,error}=await sb.from("kb_articles").select("*").order("updated_at",{ascending:false});
 if(error){kbStatus.textContent="读取失败："+error.message;kbStatus.className="statusbar err";return}
 articles=data||[];kbStatus.textContent=`已同步 ${articles.length} 篇教程`;kbStatus.className="statusbar ok";renderArticles()
}
function renderArticles(){
 if(!articles.length){kbList.innerHTML=`<div class="empty">${sb?"还没有教程。点右上角「＋ 新增教程」开始上传。":"先点右上角「数据连接」，连接 Supabase 后即可跨设备同步教程。"}</div>`;return}
 kbList.innerHTML=articles.map(a=>`<div class="kb-item" onclick='editArticle(${JSON.stringify(a.id)})'><div><h3>${esc(a.title)}</h3><p>${esc((a.content||"").slice(0,110))}${(a.content||"").length>110?"…":""}</p></div><div class="kb-meta"><span class="tag">${esc(a.category||"未分类")}</span><span class="tag ${a.status==="draft"?"red":""}">${a.status==="draft"?"草稿":"已启用"}</span></div></div>`).join("")
}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function newArticle(){if(!sb){openSetup();return}articleId.value="";aTitle.value="";aCategory.value="";aStatus.value="active";aKeywords.value="";aContent.value="";currentAssets=[];pendingFiles=[];renderAssets();editorTitle.textContent="新增教程";deleteBtn.style.visibility="hidden";editorStatus.textContent="";editorOverlay.classList.add("show")}
function editArticle(id){const a=articles.find(x=>x.id===id);if(!a)return;articleId.value=a.id;aTitle.value=a.title||"";aCategory.value=a.category||"";aStatus.value=a.status||"active";aKeywords.value=(a.keywords||[]).join(", ");aContent.value=a.content||"";currentAssets=a.assets||[];pendingFiles=[];renderAssets();editorTitle.textContent="编辑教程";deleteBtn.style.visibility="visible";editorStatus.textContent="";editorOverlay.classList.add("show")}
function closeEditor(){editorOverlay.classList.remove("show")}
assetInput.addEventListener("change",e=>{pendingFiles=[...pendingFiles,...Array.from(e.target.files||[])];renderAssets();assetInput.value=""})
function renderAssets(){
 const old=currentAssets.map((a,i)=>`<div class=asset>${esc(a.name||"文件")}<button onclick="event.stopPropagation();removeOld(${i})">×</button></div>`);
 const neu=pendingFiles.map((f,i)=>`<div class=asset>${esc(f.name)}<button onclick="event.stopPropagation();removeNew(${i})">×</button></div>`);
 assetList.innerHTML=[...old,...neu].join("")
}
function removeOld(i){currentAssets.splice(i,1);renderAssets()} function removeNew(i){pendingFiles.splice(i,1);renderAssets()}
async function uploadPending(articleIdValue){
 const uploaded=[];
 for(const f of pendingFiles){
  const safe=(Date.now()+"_"+Math.random().toString(36).slice(2)+"_"+f.name).replace(/[^\w.\-]/g,"_");
  const path=`${articleIdValue}/${safe}`;
  const {error}=await sb.storage.from("kb-assets").upload(path,f,{upsert:false});
  if(error)throw error;
  const {data}=sb.storage.from("kb-assets").getPublicUrl(path);
  uploaded.push({name:f.name,path,url:data.publicUrl,type:f.type,size:f.size});
 }
 return uploaded
}
async function saveArticle(){
 if(!sb){editorStatus.textContent="尚未连接数据";return}
 const title=aTitle.value.trim(); if(!title){editorStatus.textContent="请先写教程名称";return}
 editorStatus.textContent="正在保存…";
 try{
  let id=articleId.value;
  const base={title,category:aCategory.value.trim(),status:aStatus.value,keywords:aKeywords.value.split(",").map(x=>x.trim()).filter(Boolean),content:aContent.value,updated_at:new Date().toISOString()};
  if(!id){
    const {data,error}=await sb.from("kb_articles").insert({...base,assets:[]}).select().single(); if(error)throw error; id=data.id;
  }else{
    const {error}=await sb.from("kb_articles").update(base).eq("id",id); if(error)throw error;
  }
  const newAssets=await uploadPending(id); const all=[...currentAssets,...newAssets];
  const {error:e2}=await sb.from("kb_articles").update({assets:all,updated_at:new Date().toISOString()}).eq("id",id); if(e2)throw e2;
  editorStatus.textContent="已保存并同步"; editorStatus.className="statusbar ok"; await loadArticles(); setTimeout(closeEditor,500)
 }catch(e){console.error(e);editorStatus.textContent="保存失败："+e.message;editorStatus.className="statusbar err"}
}
async function deleteArticle(){
 const id=articleId.value;if(!id||!confirm("确定删除这篇教程吗？"))return;
 const {error}=await sb.from("kb_articles").delete().eq("id",id);if(error){editorStatus.textContent="删除失败："+error.message;return}
 await loadArticles();closeEditor()
}
renderHome();renderArticles();initSupabase();
</script>
</body></html>
