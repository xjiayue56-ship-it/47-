<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>47 小助手</title>
<style>
:root{--bg:#f5f5f2;--paper:#fff;--ink:#111;--muted:#8c8c86;--line:#e9e9e5;--soft:#f1f1ed;--red:#d92d20}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif}
button,input,textarea{font:inherit}.shell{min-height:100dvh;padding:24px 28px 92px}.top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:25px}.title{font-size:30px;font-weight:700;letter-spacing:-1px}.date{font-size:12px;color:var(--muted);margin-top:6px}.live{font-size:12px}.live:before{content:"";display:inline-block;width:7px;height:7px;background:#111;border-radius:50%;margin-right:7px}
.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.75fr);gap:26px}.section-title{font-size:12px;color:var(--muted);margin-bottom:12px}
.queue{border-top:1px solid var(--line)}.case{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:13px;align-items:center;padding:17px 2px;border-bottom:1px solid var(--line);cursor:pointer}.avatar{width:42px;height:42px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-size:13px}.case h3{font-size:15px;margin:0 0 5px}.case p{font-size:12px;color:var(--muted);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag{font-size:11px;padding:6px 9px;border-radius:999px;background:var(--soft)}.tag.red{color:var(--red)}
.logs{border-top:1px solid var(--line)}.log{padding:15px 0;border-bottom:1px solid var(--line)}.time{font-size:10px;color:var(--muted);margin-bottom:5px}.log b{font-size:13px;font-weight:620}.log p{font-size:12px;color:#555;line-height:1.55;margin:5px 0 0}.count{font-size:11px;color:var(--red);margin-left:5px}
.dock-wrap{position:fixed;left:0;right:0;bottom:18px;display:flex;justify-content:center;pointer-events:none}.dock{pointer-events:auto;background:rgba(255,255,255,.78);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(0,0,0,.07);box-shadow:0 10px 35px rgba(0,0,0,.08);border-radius:24px;padding:8px;display:flex;gap:5px}.dock button{border:0;background:transparent;padding:10px 15px;border-radius:17px;cursor:pointer}.dock button.active{background:#111;color:#fff}
.overlay{position:fixed;inset:0;background:rgba(245,245,242,.72);backdrop-filter:blur(16px);display:none;align-items:center;justify-content:center;padding:22px}.overlay.show{display:flex}.chat{width:min(760px,100%);height:min(760px,88dvh);background:#fff;border-radius:28px;display:flex;flex-direction:column;box-shadow:0 20px 70px rgba(0,0,0,.12);overflow:hidden}.chat-head{padding:19px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.chat-head small{color:var(--muted)}.close{border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;cursor:pointer}.msgs{flex:1;overflow:auto;padding:23px;display:flex;flex-direction:column;gap:12px}.msg{max-width:78%;padding:10px 13px;border-radius:17px;font-size:14px;line-height:1.5}.user{background:var(--soft)}.ai,.human{align-self:flex-end}.ai{background:#111;color:#fff}.human{border:1px solid #111}.composer{padding:13px 17px;border-top:1px solid var(--line);display:flex;gap:8px}.composer input{flex:1;border:0;background:var(--soft);border-radius:15px;padding:12px;outline:none}.send{border:0;background:#111;color:#fff;border-radius:15px;padding:0 17px}.mini-actions{padding:0 17px 13px;display:flex;gap:8px}.mini-actions button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:11px}
.view{display:none}.view.active{display:block}.empty{padding:60px 0;color:var(--muted);font-size:13px}
@media(max-width:800px){.shell{padding:20px 18px 92px}.grid{grid-template-columns:1fr}.title{font-size:26px}.right{margin-top:12px}.case{grid-template-columns:40px minmax(0,1fr) auto}.avatar{width:38px;height:38px}.dock button{padding:9px 12px}.chat{border-radius:22px;height:92dvh}}
</style></head>
<body>
<div class="shell">
 <div class="top"><div><div class="title">47 小助手</div><div class="date">管理台 · 今天</div></div><div class="live">助手在线</div></div>

 <div id="home" class="view active">
  <div class="grid">
   <section>
    <div class="section-title">正在处理</div>
    <div class="queue" id="queue"></div>
   </section>
   <aside class="right">
    <div class="section-title">今日日志</div>
    <div class="logs" id="logs"></div>
   </aside>
  </div>
 </div>

 <div id="knowledge" class="view"><div class="section-title">知识库</div><div class="queue">
  <div class="case"><div class="avatar">API</div><div><h3>API 新手入门</h3><p>识别完全没接触过 API 的用户，使用低术语、逐步引导。</p></div><span class="tag">已同步</span></div>
  <div class="case"><div class="avatar">URL</div><div><h3>URL / 令牌查找</h3><p>站点注册后如何定位 v1 链接、令牌及复制方式。</p></div><span class="tag">已同步</span></div>
  <div class="case"><div class="avatar">IMG</div><div><h3>教程图片</h3><p>未来可在这里上传教程截图，由助手按上下文发送。</p></div><span class="tag">待扩展</span></div>
 </div></div>

 <div id="review" class="view"><div class="section-title">需要确认</div><div class="queue">
  <div class="case"><div class="avatar">M</div><div><h3>Momo · 模型列表为空</h3><p>重新导入与重新复制 URL 后仍为空，需要确认站点兼容情况。</p></div><span class="tag red">待你确认</span></div>
 </div></div>
</div>

<div class="dock-wrap"><nav class="dock">
 <button class="active" onclick="showView('home',this)">处理中</button>
 <button onclick="showView('knowledge',this)">知识库</button>
 <button onclick="showView('review',this)">待确认</button>
</nav></div>

<div class="overlay" id="overlay"><div class="chat">
 <div class="chat-head"><div><b id="chatName"></b><br><small id="chatStatus"></small></div><button class="close" onclick="closeChat()">×</button></div>
 <div class="msgs" id="msgs"></div>
 <div class="mini-actions"><button onclick="takeover()">人工接管</button><button onclick="handoff()">交还助手</button><button onclick="needReview()">需要确认</button></div>
 <div class="composer"><input id="input" placeholder="人工回复…"><button class="send" onclick="sendMsg()">发送</button></div>
</div></div>

<script>
const cases=[
{name:"小雨",status:"AI 正在处理",topic:"API 是什么？新手引导中",preview:"正在解释 API，并准备引导寻找 API 站。",messages:[["user","老师 API 是什么呀？"],["ai","简单说，API 就是让 47 可以调用你选择的模型服务。你看起来是第一次接触，我先不讲一堆术语。"],["ai","下一步先找一个想用的 API 站就行。可以先去小红书搜「API 站」，看看大家最近在用哪些。"]]},
{name:"Momo",status:"需要你确认",topic:"模型列表为空",preview:"重新导入和复制 URL 后仍为空。",messages:[["user","我都导入了为什么没有模型呀"],["ai","我先确认一下：导入成功了，但是模型列表是空的，对吗？"],["user","对，重新导了也没有"]]},
{name:"77",status:"人工处理中",topic:"语音无法播放",preview:"已人工接管，等待用户发送设置截图。",messages:[["user","语音为什么播放不了"],["human","你把语音设置那一页截图给我看看。"]]}
];
const logs=[
["12:18","API 新手问题已解决","已完成基础解释并同步「新手识别 → 低术语引导」规则。","重复 4 次"],
["11:46","新增问题：模型列表为空","已有排查步骤无法解决，已自动加入「待确认」。",""],
["10:30","语音设置问题已解决","用户配置错误；解决步骤已记录到知识库草稿。","重复 2 次"],
["09:12","知识库已更新","「如何寻找 API 站」新增不主动提供推广/返利链接规范。",""]
];
let active=0;
function render(){
 queue.innerHTML=cases.map((x,i)=>`<div class="case" onclick="openChat(${i})"><div class="avatar">${x.name.slice(0,1)}</div><div><h3>${x.name} · ${x.topic}</h3><p>${x.preview}</p></div><span class="tag ${x.status.includes('确认')?'red':''}">${x.status}</span></div>`).join("");
 logs.innerHTML=logs.map(x=>`<div class="log"><div class="time">${x[0]}</div><b>${x[1]}</b>${x[3]?`<span class=count>${x[3]}</span>`:""}<p>${x[2]}</p></div>`).join("");
}
function openChat(i){active=i;let x=cases[i];chatName.textContent=x.name;chatStatus.textContent=x.status;msgs.innerHTML=x.messages.map(m=>`<div class="msg ${m[0]}">${m[1]}</div>`).join("");overlay.classList.add("show");msgs.scrollTop=99999}
function closeChat(){overlay.classList.remove("show")}
function takeover(){cases[active].status="人工处理中";openChat(active);render()}
function handoff(){cases[active].status="AI 正在处理";openChat(active);render()}
function needReview(){cases[active].status="需要你确认";openChat(active);render()}
function sendMsg(){let t=input.value.trim();if(!t)return;cases[active].messages.push(["human",t]);cases[active].status="人工处理中";input.value="";openChat(active);render()}
function showView(id,b){document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll(".dock button").forEach(x=>x.classList.remove("active"));b.classList.add("active")}
render();
</script>
</body></html>
